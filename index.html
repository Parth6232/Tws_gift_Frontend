    <!-- Prevent theme flash before hydration -->
    <script>
      (function () {
        try {
          var persistedTheme = null;
          var persistData = localStorage.getItem('persist:theme');
          if (persistData) {
            var parsed = JSON.parse(persistData);
            if (parsed && parsed.mode) {
              persistedTheme = JSON.parse(parsed.mode);
            }
          }
          if (!persistedTheme) {
            persistedTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', persistedTheme);
          document.documentElement.classList.add(persistedTheme);
          if (persistedTheme === 'dark') {
            document.documentElement.style.backgroundColor = '#1C1210';
          } else {
            document.documentElement.style.backgroundColor = '#FFF8EC';
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
